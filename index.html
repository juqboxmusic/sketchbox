<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDF9F3">
<title>SketchBox</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#FDF9F3;
  --ink:#33404F;
  --ink-soft:#7A8699;
  --card:#FFFFFF;
  --accent:#4D96FF;
  --accent-soft:#E3EEFF;
  --coral:#FF6B6B;
  --coral-soft:#FFE7E7;
  --yellow:#FFD93D;
  --green:#6BCB77;
  --radius:18px;
  --shadow:0 4px 14px rgba(51,64,79,.10);
  --shadow-big:0 10px 34px rgba(51,64,79,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  display:flex;flex-direction:column;
  height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded","Comic Sans MS",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=range]{accent-color:var(--accent)}

/* ---------- Header ---------- */
header{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px 6px;
}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px;letter-spacing:-.3px}
.logo img{display:block;width:30px;height:30px;border-radius:8px}
.spacer{flex:1}

.mode-switch{
  display:flex;gap:4px;background:#EFE9DF;border-radius:999px;padding:4px;
}
.mode-btn{
  display:flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:999px;font-weight:800;font-size:14.5px;
  color:var(--ink-soft);transition:all .15s ease;
}
.mode-btn svg{width:19px;height:19px}
.mode-btn.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.mode-btn#tabDraw.on{color:#E4573D}
.mode-btn#tabPixel.on{color:#3B7FE0}
.mode-btn#tabAnim.on{color:#3FA653}

.header-actions{display:flex;gap:8px}
.hbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-width:56px;height:56px;padding:0 8px;
  background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  font-size:11px;font-weight:700;color:var(--ink);
  transition:transform .1s ease;
}
.hbtn:active{transform:scale(.93)}
.hbtn svg{width:22px;height:22px}
.hbtn:disabled{opacity:.35;cursor:default}
.hbtn:disabled:active{transform:none}
.hbtn.export{background:var(--green);color:#fff}
.hbtn.export svg{stroke:#fff}

/* ---------- Stage ---------- */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 14px;min-height:0;position:relative}
#wrap{
  position:relative;background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow-big);
}
#wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{touch-action:none}
canvas{-webkit-touch-callout:none}

/* selection mini-toolbar */
#selBar{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:none;align-items:center;gap:12px;
  background:var(--card);border-radius:999px;box-shadow:var(--shadow-big);
  padding:10px 16px;z-index:5;
}
#selBar.show{display:flex}
#selBar label{font-size:13px;font-weight:800;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
#selBar input[type=range]{width:110px}
#selBar .done{
  background:var(--green);color:#fff;font-weight:800;font-size:14px;
  padding:8px 16px;border-radius:999px;
}

/* ---------- Dock ---------- */
footer{
  display:flex;flex-direction:column;gap:8px;
  padding:4px 14px calc(12px + env(safe-area-inset-bottom));
  position:relative;
}
.dock-row{
  display:flex;align-items:center;gap:8px;justify-content:center;
  overflow-x:auto;scrollbar-width:none;padding:4px 2px;
}
.dock-row::-webkit-scrollbar{display:none}
.dock-label{font-size:13px;font-weight:800;color:var(--ink-soft);margin-right:2px;white-space:nowrap}

.tbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-width:58px;height:58px;flex-shrink:0;
  background:var(--card);border:3px solid transparent;border-radius:var(--radius);
  box-shadow:var(--shadow);
  font-size:10.5px;font-weight:800;color:var(--ink);
  transition:transform .1s ease,border-color .12s ease,background .12s ease;
}
.tbtn:active{transform:scale(.92)}
.tbtn svg{width:24px;height:24px}
.tbtn.on{border-color:var(--accent);background:var(--accent-soft);color:#2660C4}
.tbtn.danger{color:#D14343}

.divider{width:2px;height:40px;background:#E8E1D4;border-radius:2px;flex-shrink:0}

.sbtn{
  width:50px;height:58px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border:3px solid transparent;border-radius:var(--radius);
  box-shadow:var(--shadow);transition:transform .1s ease,border-color .12s ease;
}
.sbtn:active{transform:scale(.92)}
.sbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.sbtn i{display:block;border-radius:50%;background:var(--ink)}

.chip{
  padding:10px 15px;border-radius:999px;flex-shrink:0;
  background:var(--card);border:3px solid transparent;box-shadow:var(--shadow);
  font-weight:800;font-size:14px;color:var(--ink-soft);
  transition:transform .1s ease,border-color .12s ease;
}
.chip:active{transform:scale(.93)}
.chip.on{border-color:#3B7FE0;background:var(--accent-soft);color:#2660C4}

#gridRow{display:none}
body.pixel #gridRow{display:flex}
#timelineRow{display:none}
body.animate #timelineRow{display:flex}
body.pixel .no-pixel{display:none}

/* timeline */
.frame-thumb{
  width:60px;height:45px;flex-shrink:0;border-radius:10px;overflow:hidden;
  border:3px solid transparent;background:#fff;box-shadow:var(--shadow);
  transition:transform .1s ease,border-color .12s ease;padding:0;position:relative;
}
.frame-thumb canvas{width:100%;height:100%;display:block}
.frame-thumb.on{border-color:#3FA653;transform:scale(1.06)}
.frame-thumb .fnum{
  position:absolute;bottom:1px;right:4px;font-size:9px;font-weight:800;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);
}
.tl-btn{
  width:44px;height:44px;flex-shrink:0;border-radius:14px;
  background:var(--card);box-shadow:var(--shadow);
  font-size:17px;font-weight:800;color:var(--ink);
  border:3px solid transparent;
  transition:transform .1s ease,border-color .12s ease;
}
.tl-btn:active{transform:scale(.9)}
.tl-btn.on{border-color:#3FA653;background:#E8F6EB}

/* colors */
.swatch{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  border:3px solid rgba(0,0,0,.10);
  box-shadow:var(--shadow);
  transition:transform .12s ease,box-shadow .12s ease;
  position:relative;
}
.swatch:active{transform:scale(.9)}
.swatch.on{transform:scale(1.14);border-color:#fff;box-shadow:0 0 0 3.5px var(--ink),0 4px 12px rgba(0,0,0,.18)}
.swatch-custom{
  background:conic-gradient(#FF6B6B,#FFD93D,#6BCB77,#4D96FF,#B983FF,#FF6B6B);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.swatch-custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.swatch-custom span{font-size:19px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}

/* ---------- Tools bubble ---------- */
#toolsPop{
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  width:min(400px, calc(100vw - 28px));
  background:var(--card);border-radius:22px;box-shadow:var(--shadow-big);
  padding:16px;display:none;flex-direction:column;gap:14px;z-index:20;
}
#toolsPop.show{display:flex}
.pop-section{display:flex;flex-direction:column;gap:8px}
.pop-title{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px}
.pop-tools{display:flex;gap:8px;flex-wrap:wrap}
.pop-tools .tbtn{min-width:66px;height:54px}
.alpha-chips{display:flex;gap:8px}
.alpha-chips .chip{flex:1;text-align:center}

/* layers */
.layer-row{
  display:flex;align-items:center;gap:10px;
  background:#FAF6EE;border-radius:14px;padding:7px 10px;
  border:3px solid transparent;cursor:pointer;
}
.layer-row.on{border-color:var(--accent);background:var(--accent-soft)}
.layer-row canvas{width:44px;height:33px;border-radius:7px;background:#fff;box-shadow:var(--shadow);flex-shrink:0}
.layer-row .lname{font-size:13px;font-weight:800;flex-shrink:0}
.layer-row input[type=range]{flex:1;min-width:40px}
.layer-row .lbtn{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:var(--card);box-shadow:var(--shadow);font-size:14px;
}
.layer-row .lbtn.off{opacity:.35}
#addLayerBtn{
  padding:10px;border-radius:14px;background:#F1ECE3;
  font-size:13.5px;font-weight:800;color:var(--ink);
}

/* ---------- Modals ---------- */
.modal{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(51,64,79,.38);z-index:50;padding:18px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.modal.show{display:flex}
.sheet{
  background:var(--card);border-radius:26px;box-shadow:var(--shadow-big);
  padding:22px;max-width:560px;width:100%;max-height:82dvh;
  display:flex;flex-direction:column;gap:16px;
  animation:pop .18s ease;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.sheet h2{margin:0;font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
.sheet h2 .close{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#F1ECE3;font-size:17px;font-weight:800;color:var(--ink-soft)}
.big-btn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:17px;border-radius:20px;font-size:17px;font-weight:800;
  box-shadow:var(--shadow);transition:transform .1s ease;
}
.big-btn:active{transform:scale(.96)}
.big-btn svg{width:24px;height:24px}
.big-btn.blue{background:var(--accent);color:#fff}.big-btn.blue svg{stroke:#fff}
.big-btn.green{background:var(--green);color:#fff}.big-btn.green svg{stroke:#fff}
.big-btn.red{background:var(--coral);color:#fff}
.big-btn.plain{background:#F1ECE3;color:var(--ink)}
.row2{display:flex;gap:12px}
.row2 .big-btn{flex:1;font-size:15px;padding:14px}
.confirm-msg{font-size:16.5px;font-weight:600;text-align:center;color:var(--ink);line-height:1.4}
.confirm-emoji{font-size:44px;text-align:center}

#galleryGrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;
  overflow-y:auto;padding:2px;
}
.gcard{
  background:#FAF6EE;border-radius:18px;padding:10px;position:relative;
  border:3px solid transparent;transition:transform .1s ease;text-align:left;
}
.gcard:active{transform:scale(.95)}
.gcard img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#fff;display:block;box-shadow:var(--shadow)}
.gcard .gname{font-size:12.5px;font-weight:800;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gdate{font-size:11px;color:var(--ink-soft);font-weight:700}
.gdel{
  position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;
  background:var(--coral);color:#fff;font-weight:800;font-size:14px;box-shadow:var(--shadow);
}
.gempty{text-align:center;color:var(--ink-soft);font-weight:700;padding:26px 10px;font-size:15px}

#toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);
  background:var(--ink);color:#fff;font-weight:800;font-size:15px;
  padding:13px 24px;border-radius:999px;box-shadow:var(--shadow-big);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1);z-index:99;pointer-events:none;
  white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  .mode-switch{order:3;flex-basis:100%;justify-content:center;margin-top:2px}
  .mode-btn{padding:9px 12px;font-size:13.5px}
  .hbtn{min-width:50px;height:50px}
  .hbtn span{display:none}
  .hbtn svg{width:24px;height:24px}
  .logo{font-size:19px}
  .dock-row{justify-content:flex-start}
  .tbtn{min-width:54px;height:54px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <img class="box" src="icon-192.png" width="30" height="30" alt="">
    SketchBox
  </div>

  <div class="spacer"></div>

  <div class="mode-switch" role="tablist" aria-label="Mode">
    <button class="mode-btn on" id="tabDraw" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.5L16 4.7a2.1 2.1 0 013 3L8.5 18.8 4 20z"/><path d="M13.5 7.2l3.3 3.3"/></svg>
      Draw
    </button>
    <button class="mode-btn" id="tabPixel" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 12h16M12 4v16"/></svg>
      Pixel Art
    </button>
    <button class="mode-btn" id="tabAnim" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5v-5z" fill="currentColor" stroke="none"/></svg>
      Animate
    </button>
  </div>

  <div class="spacer"></div>

  <div class="header-actions">
    <button class="hbtn" id="undoBtn" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 016 6 6 6 0 01-6 6h-3"/></svg>
      <span>Undo</span>
    </button>
    <button class="hbtn" id="redoBtn" aria-label="Redo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 00-6 6 6 6 0 006 6h3"/></svg>
      <span>Redo</span>
    </button>
    <button class="hbtn" id="saveBtn" aria-label="Save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l5 5v11a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M8 3v5h7V3"/><path d="M7 21v-7h10v7"/></svg>
      <span>Save</span>
    </button>
    <button class="hbtn" id="galleryBtn" aria-label="My sketches">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg>
      <span>Sketches</span>
    </button>
    <button class="hbtn export" id="exportBtn" aria-label="Export image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
      <span>Export</span>
    </button>
  </div>
</header>

<main id="stage">
  <div id="wrap">
    <canvas id="view" width="1280" height="960"></canvas>
    <canvas id="gridC" width="1280" height="960"></canvas>
    <canvas id="overlay" width="1280" height="960"></canvas>
  </div>
  <div id="selBar">
    <label>Opacity <input type="range" id="selAlpha" min="5" max="100" value="100"></label>
    <button class="done" id="selDone">✓ Done</button>
  </div>
</main>

<footer>
  <div id="toolsPop">
    <div class="pop-section no-pixel">
      <div class="pop-title">Shapes</div>
      <div class="pop-tools">
        <button class="tbtn" data-tool="line" aria-label="Line">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="5" r="1.6" fill="currentColor" stroke="none"/></svg>
          Line
        </button>
        <button class="tbtn" data-tool="rect" aria-label="Rectangle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
          Box
        </button>
        <button class="tbtn" data-tool="circle" aria-label="Circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/></svg>
          Circle
        </button>
      </div>
    </div>
    <div class="pop-section">
      <div class="pop-title">Move &amp; select</div>
      <div class="pop-tools">
        <button class="tbtn" data-tool="move" aria-label="Move the whole layer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>
          Move
        </button>
        <button class="tbtn" data-tool="select" aria-label="Select a box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 3"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          Select
        </button>
        <button class="tbtn" data-tool="wand" aria-label="Grab an object by its colour">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20l9-9"/><path d="M15 4v4M13 6h4"/><path d="M19 11v3M17.5 12.5h3"/><path d="M10 3v3M8.5 4.5h3"/></svg>
          Grab
        </button>
      </div>
    </div>
    <div class="pop-section">
      <div class="pop-title">Brush opacity</div>
      <div class="alpha-chips" id="alphaChips">
        <button class="chip" data-alpha="0.25">25%</button>
        <button class="chip" data-alpha="0.5">50%</button>
        <button class="chip" data-alpha="0.75">75%</button>
        <button class="chip on" data-alpha="1">100%</button>
      </div>
    </div>
    <div class="pop-section">
      <div class="pop-title">Background</div>
      <div class="alpha-chips" id="bgChips">
        <button class="chip on" data-bg="white">⬜ White</button>
        <button class="chip" data-bg="transparent">🏁 Clear</button>
      </div>
    </div>
    <div class="pop-section">
      <div class="pop-title">Layers</div>
      <div id="layerList" style="display:flex;flex-direction:column;gap:8px"></div>
      <button id="addLayerBtn">＋ Add layer</button>
    </div>
  </div>

  <div class="dock-row" id="timelineRow" aria-label="Animation timeline">
    <button class="tl-btn" id="playBtn" aria-label="Play">▶</button>
    <span id="frameStrip" style="display:flex;gap:8px;align-items:center"></span>
    <button class="tl-btn" id="addFrameBtn" aria-label="Add frame">＋</button>
    <button class="tl-btn" id="dupFrameBtn" aria-label="Duplicate frame">⧉</button>
    <button class="tl-btn" id="delFrameBtn" aria-label="Delete frame">🗑</button>
    <div class="divider"></div>
    <button class="tl-btn" id="onionBtn" aria-label="Onion skin">👻</button>
    <button class="chip" id="fpsBtn" aria-label="Speed">6 fps</button>
  </div>

  <div class="dock-row" id="gridRow" aria-label="Pixel grid size"></div>

  <div class="dock-row" id="toolRow">
    <button class="tbtn on" data-tool="brush" aria-label="Brush">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.5L16 4.7a2.1 2.1 0 013 3L8.5 18.8 4 20z"/><path d="M13.5 7.2l3.3 3.3"/></svg>
      Brush
    </button>
    <button class="tbtn" data-tool="eraser" aria-label="Eraser">

<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ============== constants & state ============== */
const W = 1280, H = 960;
const SIZES_DRAW = [4, 10, 22, 42];
const SIZES_PIX  = [1, 2, 3, 4];
const GRID_SIZES = [8, 12, 16, 24, 32, 48];
const FPS_STEPS  = [2, 4, 6, 12];
const MAX_LAYERS = 3, MAX_FRAMES = 24, MAX_UNDO = 20;
const PALETTE = [
  '#1F2937','#9CA3AF','#FFFFFF','#EF4444','#F97316','#FACC15',
  '#22C55E','#15803D','#14B8A6','#38BDF8','#2563EB','#8B5CF6',
  '#EC4899','#FBCFE8','#8D5524','#F1C27D'
];
const LS_AUTOSAVE = 'sketchbox:autosave';
const LS_GALLERY  = 'sketchbox:gallery';
const SHAPES = ['line','rect','circle'];

const state = {
  tab: 'draw',            // draw | pixel | animate
  tool: 'brush',
  prevTool: 'brush',
  color: '#2563EB',
  sizeIdx: 1,
  alpha: 1,
  grid: 16,
  fps: 6,
  onion: true,
  playing: false,
  frame: 0,
  layer: 0,
  bg: 'white',            // 'white' | 'transparent'
  docId: null
};

let frames = [];            // [{layers:[{cv, opacity, visible, cache}]}]

const viewC = $('#view'), gridCv = $('#gridC'), ovC = $('#overlay');
const vctx = viewC.getContext('2d', { willReadFrequently: true });
const gctx = gridCv.getContext('2d');
const octx = ovC.getContext('2d');
const strokeC = document.createElement('canvas');
strokeC.width = W; strokeC.height = H;
const sctx = strokeC.getContext('2d');

/* ============== helpers ============== */
function hexRGB(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbHex(r, g, b){
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
}
let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function openModal(id){ $(id).classList.add('show'); }
function closeModals(){ $$('.modal').forEach(m => m.classList.remove('show')); }
$$('.modal').forEach(m => {
  m.addEventListener('pointerdown', e => { if (e.target === m) closeModals(); });
});
$$('[data-close]').forEach(b => b.addEventListener('click', closeModals));

let confirmCb = null;
function askConfirm(emoji, msg, yesLabel, cb){
  $('#confirmEmoji').textContent = emoji;
  $('#confirmMsg').textContent = msg;
  $('#confirmYes').textContent = yesLabel;
  confirmCb = cb;
  openModal('#confirmModal');
}
$('#confirmYes').addEventListener('click', () => {
  closeModals();
  if (confirmCb) { const cb = confirmCb; confirmCb = null; cb(); }
});

/* ============== project model ============== */
function newLayer(){
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  return { cv, opacity: 1, visible: true, cache: null };
}
function newFrame(){ return { layers: [newLayer()] }; }
function curFrame(){ return frames[state.frame]; }
function curLayer(){ return curFrame().layers[state.layer]; }
function invalidate(l){ l.cache = null; }
function layerURL(l){
  if (!l.cache) l.cache = l.cv.toDataURL();
  return l.cache;
}
function drawURLInto(l, url){
  return new Promise(res => {
    const ctx = l.cv.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    if (!url){ invalidate(l); res(); return; }
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, W, H); invalidate(l); res(); };
    img.onerror = () => { invalidate(l); res(); };
    img.src = url;
  });
}

/* ============== rendering ============== */
function drawFrameInto(ctx, fr, mult){
  for (const l of fr.layers){
    if (!l.visible) continue;
    ctx.globalAlpha = (mult || 1) * l.opacity;
    ctx.drawImage(l.cv, 0, 0);
  }
  ctx.globalAlpha = 1;
}
let checkerPattern = null;
function getChecker(){
  if (!checkerPattern){
    const t = document.createElement('canvas');
    t.width = t.height = 48;
    const c = t.getContext('2d');
    c.fillStyle = '#F2F2F2'; c.fillRect(0, 0, 48, 48);
    c.fillStyle = '#D9D9D9'; c.fillRect(0, 0, 24, 24); c.fillRect(24, 24, 24, 24);
    checkerPattern = vctx.createPattern(t, 'repeat');
  }
  return checkerPattern;
}
function render(){
  vctx.clearRect(0, 0, W, H);
  vctx.fillStyle = state.bg === 'transparent' ? getChecker() : '#FFFFFF';
  vctx.fillRect(0, 0, W, H);
  if (state.tab === 'animate' && state.onion && !state.playing && state.frame > 0){
    drawFrameInto(vctx, frames[state.frame - 1], 0.3);
  }
  drawFrameInto(vctx, curFrame());
}
function drawGrid(){
  gctx.clearRect(0, 0, W, H);
  if (state.tab !== 'pixel') return;
  const cell = W / state.grid, rows = Math.round(H / cell);
  gctx.strokeStyle = 'rgba(51,64,79,0.10)';
  gctx.lineWidth = 1;
  gctx.beginPath();
  for (let i = 1; i < state.grid; i++){ gctx.moveTo(i * cell, 0); gctx.lineTo(i * cell, H); }
  for (let i = 1; i < rows; i++){ gctx.moveTo(0, i * cell); gctx.lineTo(W, i * cell); }
  gctx.stroke();
}

/* ============== layout / tabs ============== */
function fitStage(){
  const stage = $('#stage');
  const pad = 8;
  const availW = stage.clientWidth - pad, availH = stage.clientHeight - pad;
  let w = availW, h = w * H / W;
  if (h > availH) { h = availH; w = h * W / H; }
  const wrap = $('#wrap');
  wrap.style.width = Math.max(80, w) + 'px';
  wrap.style.height = Math.max(80, h) + 'px';
}
window.addEventListener('resize', fitStage);

function setTab(tab){
  commitSelection();
  stopPlayback();
  hideToolsPop();
  state.tab = tab;
  document.body.classList.toggle('pixel', tab === 'pixel');
  document.body.classList.toggle('animate', tab === 'animate');
  $('#tabDraw').classList.toggle('on', tab === 'draw');
  $('#tabPixel').classList.toggle('on', tab === 'pixel');
  $('#tabAnim').classList.toggle('on', tab === 'animate');
  $('#tabDraw').setAttribute('aria-selected', tab === 'draw');
  $('#tabPixel').setAttribute('aria-selected', tab === 'pixel');
  $('#tabAnim').setAttribute('aria-selected', tab === 'animate');
  if (tab === 'pixel' && SHAPES.includes(state.tool)) setTool('brush');
  drawGrid();
  render();
  renderTimeline();
  fitStage();
  scheduleAutosave();
}
$('#tabDraw').addEventListener('click', () => setTab('draw'));
$('#tabPixel').addEventListener('click', () => setTab('pixel'));
$('#tabAnim').addEventListener('click', () => setTab('animate'));

/* ============== tools / sizes / colors UI ============== */
const ADVANCED = [...SHAPES, 'select', 'move', 'wand'];
function setTool(tool){
  if (tool !== state.tool) commitSelection();
  if (state.tool !== 'eyedrop') state.prevTool = state.tool;
  state.tool = tool;
  $$('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === tool));
  $('#toolsBtn').classList.toggle('on', ADVANCED.includes(tool));
  hideToolsPop();
}
$$('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

$$('.sbtn').forEach(b => b.addEventListener('click', () => {
  state.sizeIdx = +b.dataset.size;
  $$('.sbtn').forEach(x => x.classList.toggle('on', x === b));
}));

$$('#alphaChips .chip').forEach(b => b.addEventListener('click', () => {
  state.alpha = +b.dataset.alpha;
  $$('#alphaChips .chip').forEach(x => x.classList.toggle('on', x === b));
}));

function setBg(v){
  state.bg = v === 'transparent' ? 'transparent' : 'white';
  $$('#bgChips .chip').forEach(x => x.classList.toggle('on', x.dataset.bg === state.bg));
  render();
  renderTimeline();
  scheduleAutosave();
}
$$('#bgChips .chip').forEach(b => b.addEventListener('click', () => setBg(b.dataset.bg)));

const colorRow = $('#colorRow');
PALETTE.forEach(hex => {
  const b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = hex;
  b.dataset.color = hex;
  b.setAttribute('aria-label', 'Colour ' + hex);
  b.addEventListener('click', () => setColor(hex));
  colorRow.appendChild(b);
});
const customBtn = document.createElement('div');
customBtn.className = 'swatch swatch-custom';
customBtn.innerHTML = '<span>+</span><input type="color" id="customColor" aria-label="Custom colour">';
colorRow.appendChild(customBtn);
$('#customColor').addEventListener('input', e => setColor(e.target.value.toUpperCase(), true));

function setColor(hex, isCustom){
  state.color = hex;
  $$('.swatch').forEach(s => s.classList.remove('on'));
  const match = $$('.swatch').find(s => s.dataset.color === hex);
  if (match && !isCustom) match.classList.add('on');
  else { customBtn.classList.add('on'); customBtn.style.background = hex; }
  $$('.sbtn i').forEach(i => i.style.background = hex);
}
setColor(state.color);

/* tools bubble */
function hideToolsPop(){ $('#toolsPop').classList.remove('show'); }
$('#toolsBtn').addEventListener('click', e => {
  e.stopPropagation();
  const pop = $('#toolsPop');
  if (pop.classList.contains('show')) hideToolsPop();
  else { renderLayers(); pop.classList.add('show'); }
});
$('#toolsPop').addEventListener('pointerdown', e => e.stopPropagation());
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#toolsPop') && !e.target.closest('#toolsBtn')) hideToolsPop();
});

/* grid chips */
const gridRow = $('#gridRow');
const gl = document.createElement('span');
gl.className = 'dock-label'; gl.textContent = 'Blocks:';
gridRow.appendChild(gl);
GRID_SIZES.forEach(n => {
  const b = document.createElement('button');
  b.className = 'chip' + (n === state.grid ? ' on' : '');
  b.textContent = n + '×' + Math.round(n * H / W);
  b.dataset.grid = n;
  b.addEventListener('click', () => setGridSize(n));
  gridRow.appendChild(b);
});
function markGridChip(){
  $$('#gridRow .chip').forEach(c => c.classList.toggle('on', +c.dataset.grid === state.grid));
}
function setGridSize(n){
  if (n === state.grid) return;
  pushUndo({ t: 'grid', v: state.grid });
  state.grid = n;
  markGridChip();
  drawGrid();
  scheduleAutosave();
}

/* ============== undo / redo (command ops) ============== */
const undoStack = [], redoStack = [];
let histBusy = false;
function pushUndo(op){
  undoStack.push(op);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
  updateUndoButtons();
}
function beginPaintOp(){
  pushUndo({ t: 'paint', f: state.frame, l: state.layer, img: layerURL(curLayer()) });
}
async function applyOp(op){
  if (op.t === 'paint'){
    const fr = frames[op.f];
    if (!fr || !fr.layers[op.l]) return null;
    const l = fr.layers[op.l];
    const inv = { t: 'paint', f: op.f, l: op.l, img: layerURL(l) };
    await drawURLInto(l, op.img);
    state.frame = Math.min(op.f, frames.length - 1);
    state.layer = Math.min(op.l, curFrame().layers.length - 1);
    return inv;
  }
  if (op.t === 'layerAdd'){ // undoing an add: remove that layer
    const fr = frames[op.f];
    const l = fr.layers.splice(op.l, 1)[0];
    state.layer = Math.min(state.layer, fr.layers.length - 1);
    return { t: 'layerDel', f: op.f, l: op.l, data: { img: layerURL(l), opacity: l.opacity, visible: l.visible } };
  }
  if (op.t === 'layerDel'){ // undoing a delete: re-insert with its pixels
    const fr = frames[op.f];
    const nl = newLayer();
    nl.opacity = op.data.opacity;
    nl.visible = op.data.visible;
    fr.layers.splice(op.l, 0, nl);
    await drawURLInto(nl, op.data.img);
    state.frame = op.f;
    state.layer = op.l;
    return { t: 'layerAdd', f: op.f, l: op.l };
  }
  if (op.t === 'layerProp'){
    const l = frames[op.f].layers[op.l];
    const inv = { t: 'layerProp', f: op.f, l: op.l, opacity: l.opacity, visible: l.visible };
    l.opacity = op.opacity;
    l.visible = op.visible;
    return inv;
  }
  if (op.t === 'frameAdd'){ // undoing an add: remove frame
    const fr = frames.splice(op.f, 1)[0];
    state.frame = Math.min(state.frame, frames.length - 1);
    state.layer = Math.min(state.layer, curFrame().layers.length - 1);
    return { t: 'frameDel', f: op.f, data: fr.layers.map(l => ({ img: layerURL(l), opacity: l.opacity, visible: l.visible })) };
  }
  if (op.t === 'frameDel'){ // undoing a delete: re-insert
    const fr = { layers: [] };
    for (const d of op.data){
      const nl = newLayer();
      nl.opacity = d.opacity; nl.visible = d.visible;
      fr.layers.push(nl);
      await drawURLInto(nl, d.img);
    }
    frames.splice(op.f, 0, fr);
    state.frame = op.f;
    state.layer = 0;
    return { t: 'frameAdd', f: op.f };
  }
  if (op.t === 'grid'){
    const inv = { t: 'grid', v: state.grid };
    state.grid = op.v;
    markGridChip();
    drawGrid();
    return inv;
  }
  return null;
}
async function doUndo(){
  if (histBusy || !undoStack.length) return;
  commitSelection();
  histBusy = true;
  try {
    const inv = await applyOp(undoStack.pop());
    if (inv) redoStack.push(inv);
  } finally { histBusy = false; }
  refreshAll();
}
async function doRedo(){
  if (histBusy || !redoStack.length) return;
  commitSelection();
  histBusy = true;
  try {
    const inv = await applyOp(redoStack.pop());
    if (inv) undoStack.push(inv);
  } finally { histBusy = false; }
  refreshAll();
}
function updateUndoButtons(){
  $('#undoBtn').disabled = !undoStack.length;
  $('#redoBtn').disabled = !redoStack.length;
}
function refreshAll(){
  render();
  renderTimeline();
  renderLayers();
  updateUndoButtons();
  scheduleAutosave();
}
$('#undoBtn').addEventListener('click', doUndo);
$('#redoBtn').addEventListener('click', doRedo);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z'){
    e.preventDefault();
    e.shiftKey ? doRedo() : doUndo();
  }
});

/* ============== layers UI ============== */
function renderLayers(){
  const box = $('#layerList');
  if (!box) return;
  box.innerHTML = '';
  const layers = curFrame().layers;
  // topmost layer first in the list
  for (let i = layers.length - 1; i >= 0; i--){
    const l = layers[i];
    const row = document.createElement('div');
    row.className = 'layer-row' + (i === state.layer ? ' on' : '');
    const th = document.createElement('canvas');
    th.width = 88; th.height = 66;
    const tc = th.getContext('2d');
    tc.fillStyle = '#fff'; tc.fillRect(0, 0, 88, 66);
    tc.drawImage(l.cv, 0, 0, 88, 66);
    row.appendChild(th);
    const name = document.createElement('span');
    name.className = 'lname';
    name.textContent = 'Layer ' + (i + 1);
    row.appendChild(name);
    const vis = document.createElement('button');
    vis.className = 'lbtn' + (l.visible ? '' : ' off');
    vis.textContent = '👁';
    vis.setAttribute('aria-label', 'Show or hide layer ' + (i + 1));
    vis.addEventListener('click', e => {
      e.stopPropagation();
      pushUndo({ t: 'layerProp', f: state.frame, l: i, opacity: l.opacity, visible: l.visible });
      l.visible = !l.visible;
      render(); renderLayers(); renderTimeline(); scheduleAutosave();
    });
    row.appendChild(vis);
    const op = document.createElement('input');
    op.type = 'range'; op.min = 0; op.max = 100; op.value = Math.round(l.opacity * 100);
    op.setAttribute('aria-label', 'Layer ' + (i + 1) + ' opacity');
    let opStart = null;
    op.addEventListener('pointerdown', () => { opStart = { opacity: l.opacity, visible: l.visible }; });
    op.addEventListener('input', () => { l.opacity = op.value / 100; render(); });
    op.addEventListener('change', () => {
      if (opStart && opStart.opacity !== l.opacity){
        pushUndo({ t: 'layerProp', f: state.frame, l: i, opacity: opStart.opacity, visible: opStart.visible });
      }
      opStart = null;
      renderTimeline(); scheduleAutosave();
    });
    op.addEventListener('click', e => e.stopPropagation());
    row.appendChild(op);
    if (layers.length > 1){
      const del = document.createElement('button');
      del.className = 'lbtn';
      del.textContent = '✕';
      del.setAttribute('aria-label', 'Delete layer ' + (i + 1));
      del.addEventListener('click', e => {
        e.stopPropagation();
        commitSelection();
        const removed = layers.splice(i, 1)[0];
        pushUndo({ t: 'layerDel', f: state.frame, l: i,
          data: { img: layerURL(removed), opacity: removed.opacity, visible: removed.visible } });
        state.layer = Math.min(state.layer, layers.length - 1);
        render(); renderLayers(); renderTimeline(); scheduleAutosave();
      });
      row.appendChild(del);
    }
    row.addEventListener('click', () => {
      commitSelection();
      state.layer = i;
      renderLayers();
    });
    box.appendChild(row);
  }
}
$('#addLayerBtn').addEventListener('click', () => {
  const layers = curFrame().layers;
  if (layers.length >= MAX_LAYERS){ toast('Max ' + MAX_LAYERS + ' layers 🙂'); return; }
  commitSelection();
  layers.push(newLayer());
  state.layer = layers.length - 1;
  pushUndo({ t: 'layerAdd', f: state.frame, l: state.layer });
  render(); renderLayers(); scheduleAutosave();
  toast('Layer added — you are drawing on it now');
});

/* ============== animation / timeline ============== */
let playTimer = null;
function stopPlayback(){
  if (playTimer){ clearInterval(playTimer); playTimer = null; }
  state.playing = false;
  $('#playBtn').textContent = '▶';
  $('#playBtn').classList.remove('on');
}
function startPlayback(){
  if (frames.length < 2){ toast('Add another frame first ➕'); return; }
  commitSelection();
  state.playing = true;
  $('#playBtn').textContent = '⏸';
  $('#playBtn').classList.add('on');
  playTimer = setInterval(() => {
    state.frame = (state.frame + 1) % frames.length;
    state.layer = Math.min(state.layer, curFrame().layers.length - 1);
    render();
    markFrameChips();
  }, 1000 / state.fps);
}
$('#playBtn').addEventListener('click', () => state.playing ? (stopPlayback(), render()) : startPlayback());

function renderTimeline(){
  if (state.tab !== 'animate') return;
  const strip = $('#frameStrip');
  strip.innerHTML = '';
  frames.forEach((fr, i) => {
    const b = document.createElement('button');
    b.className = 'frame-thumb' + (i === state.frame ? ' on' : '');
    b.dataset.frame = i;
    const cv = document.createElement('canvas');
    cv.width = 120; cv.height = 90;
    const c = cv.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, 120, 90);
    c.save(); c.scale(120 / W, 90 / H); drawFrameInto(c, fr); c.restore();
    b.appendChild(cv);
    const n = document.createElement('span');
    n.className = 'fnum'; n.textContent = i + 1;
    b.appendChild(n);
    b.addEventListener('click', () => {
      stopPlayback();
      commitSelection();
      state.frame = i;
      state.layer = Math.min(state.layer, curFrame().layers.length - 1);
      render(); renderTimeline(); renderLayers();
    });
    strip.appendChild(b);
  });
  $('#onionBtn').classList.toggle('on', state.onion);
  $('#fpsBtn').textContent = state.fps + ' fps';
}
function markFrameChips(){
  $$('.frame-thumb').forEach(t => t.classList.toggle('on', +t.dataset.frame === state.frame));
}
$('#addFrameBtn').addEventListener('click', () => addFrame(false));
$('#dupFrameBtn').addEventListener('click', () => addFrame(true));
function addFrame(duplicate){
  if (frames.length >= MAX_FRAMES){ toast('Max ' + MAX_FRAMES + ' frames 🙂'); return; }
  stopPlayback();
  commitSelection();
  const fr = { layers: [] };
  const src = curFrame();
  for (const l of src.layers){
    const nl = newLayer();
    nl.opacity = l.opacity; nl.visible = l.visible;
    if (duplicate) nl.cv.getContext('2d').drawImage(l.cv, 0, 0);
    fr.layers.push(nl);
  }
  frames.splice(state.frame + 1, 0, fr);
  state.frame++;
  state.layer = Math.min(state.layer, fr.layers.length - 1);
  pushUndo({ t: 'frameAdd', f: state.frame });
  render(); renderTimeline(); renderLayers(); scheduleAutosave();
}
$('#delFrameBtn').addEventListener('click', () => {
  if (frames.length <= 1){ toast('This is the only frame 🙂'); return; }
  stopPlayback();
  commitSelection();
  askConfirm('🗑️', 'Delete frame ' + (state.frame + 1) + '?', 'Yes, delete it', () => {
    const idx = state.frame;
    const fr = frames.splice(idx, 1)[0];
    pushUndo({ t: 'frameDel', f: idx,
      data: fr.layers.map(l => ({ img: layerURL(l), opacity: l.opacity, visible: l.visible })) });
    state.frame = Math.min(idx, frames.length - 1);
    state.layer = Math.min(state.layer, curFrame().layers.length - 1);
    render(); renderTimeline(); renderLayers(); scheduleAutosave();
  });
});
$('#onionBtn').addEventListener('click', () => {
  state.onion = !state.onion;
  $('#onionBtn').classList.toggle('on', state.onion);
  render();
});
$('#fpsBtn').addEventListener('click', () => {
  state.fps = FPS_STEPS[(FPS_STEPS.indexOf(state.fps) + 1) % FPS_STEPS.length];
  $('#fpsBtn').textContent = state.fps + ' fps';
  if (state.playing){ stopPlayback(); startPlayback(); }
  scheduleAutosave();
});

/* ============== painting ============== */
function getPos(e){
  const r = ovC.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * W / r.width,
    y: (e.clientY - r.top) * H / r.height
  };
}
function strokeInto(ctx, a, b){
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = SIZES_DRAW[state.sizeIdx];
  ctx.strokeStyle = state.color;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x + 0.01, b.y + 0.01);
  ctx.stroke();
}
function shapeInto(ctx, a, b){
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = SIZES_DRAW[state.sizeIdx];
  ctx.strokeStyle = state.color;
  ctx.beginPath();
  if (state.tool === 'line'){ ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
  else if (state.tool === 'rect'){ ctx.rect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y)); }
  else { ctx.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, Math.PI * 2); }
  ctx.stroke();
}
/* pixel cells */
function cellAt(p){
  const cell = W / state.grid, rows = Math.round(H / cell);
  return {
    x: Math.max(0, Math.min(state.grid - 1, Math.floor(p.x / cell))),
    y: Math.max(0, Math.min(rows - 1, Math.floor(p.y / cell)))
  };
}
function paintCellInto(ctx, cx, cy, erase){
  const cell = W / state.grid, k = SIZES_PIX[state.sizeIdx];
  const off = Math.floor((k - 1) / 2);
  const x = (cx - off) * cell, y = (cy - off) * cell;
  if (erase) ctx.clearRect(x, y, k * cell, k * cell);
  else { ctx.fillStyle = state.color; ctx.fillRect(x, y, k * cell, k * cell); }
}
function lineCells(a, b, fn){
  let x0 = a.x, y0 = a.y;
  const x1 = b.x, y1 = b.y;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;){
    fn(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy){ err += dy; x0 += sx; }
    if (e2 <= dx){ err += dx; y0 += sy; }
  }
}
/* preview of in-progress stroke: composite + stroke buffer at brush alpha */
function previewStroke(){
  octx.clearRect(0, 0, W, H);
  octx.globalAlpha = state.alpha;
  octx.drawImage(strokeC, 0, 0);
  octx.globalAlpha = 1;
}
function commitStroke(){
  const ctx = curLayer().cv.getContext('2d');
  ctx.globalAlpha = state.alpha;
  ctx.drawImage(strokeC, 0, 0);
  ctx.globalAlpha = 1;
  invalidate(curLayer());
  octx.clearRect(0, 0, W, H);
  render();
}
/* flood fill: region found on the visible composite, painted into active layer */
/* fill & eyedropper reference image: current frame on plain white — no
   checkerboard, no onion skin, so region detection matches what's drawn */
function compositeOnWhite(){
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#FFFFFF';
  x.fillRect(0, 0, W, H);
  drawFrameInto(x, curFrame());
  return x;
}
function floodFill(p){
  const sx = Math.floor(p.x), sy = Math.floor(p.y);
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
  const img = compositeOnWhite().getImageData(0, 0, W, H);
  const d = img.data;
  const i0 = (sy * W + sx) * 4;
  const tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2];
  const [fr_, fg, fb] = hexRGB(state.color);
  if (Math.abs(tr - fr_) + Math.abs(tg - fg) + Math.abs(tb - fb) < 12) return;
  const TOL = 120;
  const visited = new Uint8Array(W * H);
  const stack = [sy * W + sx];
  const mask = new Uint8Array(W * H);
  while (stack.length){
    const idx = stack.pop();
    if (visited[idx]) continue;
    visited[idx] = 1;
    const i = idx * 4;
    if (Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) > TOL) continue;
    mask[idx] = 1;
    const x = idx % W;
    if (x > 0) stack.push(idx - 1);
    if (x < W - 1) stack.push(idx + 1);
    if (idx >= W) stack.push(idx - W);
    if (idx < W * (H - 1)) stack.push(idx + W);
  }
  const lctx = curLayer().cv.getContext('2d');
  const limg = lctx.getImageData(0, 0, W, H);
  const ld = limg.data;
  for (let idx = 0; idx < mask.length; idx++){
    if (!mask[idx]) continue;
    const i = idx * 4;
    ld[i] = fr_; ld[i + 1] = fg; ld[i + 2] = fb; ld[i + 3] = 255;
  }
  lctx.putImageData(limg, 0, 0);
  invalidate(curLayer());
  render();
}
function pickColorAt(p){
  const px = compositeOnWhite().getImageData(Math.floor(p.x), Math.floor(p.y), 1, 1).data;
  const hex = rgbHex(px[0], px[1], px[2]);
  setColor(hex, !PALETTE.includes(hex));
  $('#customColor').value = hex;
  toast('Colour picked! 🎨');
  setTool(state.prevTool && !['eyedrop'].includes(state.prevTool) ? state.prevTool : 'brush');
}

/* ============== selection tool ============== */
let sel = null; // {x,y,w,h, buf:null|canvas, alpha, mode:'idle'}

/* centre snapping: thin guide lines when dragged content hits canvas centre */
const SNAP = 14;
let guideV = false, guideH = false;
function drawGuides(ctx){
  if (!guideV && !guideH) return;
  ctx.save();
  ctx.strokeStyle = '#FF3FA4';
  ctx.lineWidth = 2.5;
  ctx.setLineDash([]);
  ctx.beginPath();
  if (guideV){ ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); }
  if (guideH){ ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); }
  ctx.stroke();
  ctx.restore();
}
function layerContentCentre(cv){
  const d = cv.getContext('2d').getImageData(0, 0, W, H).data;
  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++){
    for (let x = 0; x < W; x++){
      if (d[(y * W + x) * 4 + 3] > 10){
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  return maxX < 0 ? null : { cx: (minX + maxX + 1) / 2, cy: (minY + maxY + 1) / 2 };
}
function drawSelRect(){
  octx.clearRect(0, 0, W, H);
  if (!sel) return;
  if (sel.buf){
    octx.globalAlpha = sel.alpha;
    octx.drawImage(sel.buf, sel.x, sel.y);
    octx.globalAlpha = 1;
  }
  octx.setLineDash([10, 7]);
  octx.lineWidth = 2.5;
  octx.strokeStyle = '#4D96FF';
  octx.strokeRect(sel.x + 0.5, sel.y + 0.5, sel.w, sel.h);
  octx.setLineDash([]);
  drawGuides(octx);
}
function liftSelection(){
  if (!sel || sel.buf) return;
  beginPaintOp();
  const l = curLayer();
  const buf = document.createElement('canvas');
  buf.width = Math.max(1, sel.w); buf.height = Math.max(1, sel.h);
  buf.getContext('2d').drawImage(l.cv, sel.x, sel.y, sel.w, sel.h, 0, 0, sel.w, sel.h);
  l.cv.getContext('2d').clearRect(sel.x, sel.y, sel.w, sel.h);
  invalidate(l);
  sel.buf = buf;
  render();
}
function commitSelection(){
  guideV = guideH = false;
  if (!sel) return;
  if (sel.buf){
    const ctx = curLayer().cv.getContext('2d');
    ctx.globalAlpha = sel.alpha;
    ctx.drawImage(sel.buf, sel.x, sel.y);
    ctx.globalAlpha = 1;
    invalidate(curLayer());
  }
  sel = null;
  octx.clearRect(0, 0, W, H);
  $('#selBar').classList.remove('show');
  render();
  scheduleAutosave();
}
$('#selDone').addEventListener('click', commitSelection);
$('#selAlpha').addEventListener('input', e => {
  if (!sel) return;
  liftSelection();
  sel.alpha = e.target.value / 100;
  drawSelRect();
});
$('#selBar').addEventListener('pointerdown', e => e.stopPropagation());

/* magic grab: lift the connected same-colour region under the tap */
function wandSelect(p){
  const l = curLayer();
  const ctx = l.cv.getContext('2d');
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const sx = Math.floor(p.x), sy = Math.floor(p.y);
  const i0 = (sy * W + sx) * 4;
  if (d[i0 + 3] < 20){ toast('Tap on a drawing to grab it 🪄'); return false; }
  const sr = d[i0], sg = d[i0 + 1], sb = d[i0 + 2];
  const TOL = 130;
  let mask = new Uint8Array(W * H);
  const visited = new Uint8Array(W * H);
  const stack = [sy * W + sx];
  let minX = sx, maxX = sx, minY = sy, maxY = sy;
  while (stack.length){
    const idx = stack.pop();
    if (visited[idx]) continue;
    visited[idx] = 1;
    const i = idx * 4;
    if (d[i + 3] < 20) continue;
    if (Math.abs(d[i] - sr) + Math.abs(d[i + 1] - sg) + Math.abs(d[i + 2] - sb) > TOL) continue;
    mask[idx] = 1;
    const x = idx % W, y = (idx - x) / W;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (x > 0) stack.push(idx - 1);
    if (x < W - 1) stack.push(idx + 1);
    if (idx >= W) stack.push(idx - W);
    if (idx < W * (H - 1)) stack.push(idx + W);
  }
  // dilate 2px to take the soft anti-aliased fringe along — but never
  // solid neighbouring artwork of a different colour
  for (let pass = 0; pass < 2; pass++){
    const nm = mask.slice();
    for (let y = 0; y < H; y++){
      for (let x = 0; x < W; x++){
        const idx = y * W + x;
        if (mask[idx]) continue;
        if ((x > 0 && mask[idx - 1]) || (x < W - 1 && mask[idx + 1]) ||
            (y > 0 && mask[idx - W]) || (y < H - 1 && mask[idx + W])){
          const i = idx * 4;
          const soft = d[i + 3] < 250;
          const near = Math.abs(d[i] - sr) + Math.abs(d[i + 1] - sg) + Math.abs(d[i + 2] - sb) <= 200;
          if (soft || near) nm[idx] = 1;
        }
      }
    }
    mask = nm;
  }
  minX = Math.max(0, minX - 2); minY = Math.max(0, minY - 2);
  maxX = Math.min(W - 1, maxX + 2); maxY = Math.min(H - 1, maxY + 2);
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  beginPaintOp();
  // copy masked pixels into the floating buffer, clear them from the layer
  const bimg = new ImageData(bw, bh);
  const bd = bimg.data;
  for (let y = minY; y <= maxY; y++){
    for (let x = minX; x <= maxX; x++){
      const idx = y * W + x;
      if (!mask[idx]) continue;
      const si = idx * 4, di = ((y - minY) * bw + (x - minX)) * 4;
      bd[di] = d[si]; bd[di + 1] = d[si + 1]; bd[di + 2] = d[si + 2]; bd[di + 3] = d[si + 3];
      d[si + 3] = 0;
    }
  }
  const buf = document.createElement('canvas');
  buf.width = bw; buf.height = bh;
  buf.getContext('2d').putImageData(bimg, 0, 0);
  ctx.putImageData(img, 0, 0);
  invalidate(l);
  sel = { x: minX, y: minY, w: bw, h: bh, buf, alpha: 1 };
  render();
  drawSelRect();
  return true;
}

/* ============== pointer input ============== */
let drawing = false, activePointer = null, last = null, startPt = null, lastCell = null;
let selDrag = null; // 'marquee' | 'move'
let selStart = null; // selection position at drag start (absolute dragging)
let moveBuf = null, moveStart = null, moveCentre = null; // move-layer tool state

ovC.addEventListener('pointerdown', e => {
  if (drawing) return;
  if (state.playing){ stopPlayback(); render(); renderTimeline(); return; }
  e.preventDefault();
  activePointer = e.pointerId;
  try { ovC.setPointerCapture(e.pointerId); } catch {}
  const p = getPos(e);

  if (state.tool === 'eyedrop'){ pickColorAt(p); return; }

  if (state.tool === 'select'){
    drawing = true;
    if (sel && p.x >= sel.x && p.x <= sel.x + sel.w && p.y >= sel.y && p.y <= sel.y + sel.h){
      selDrag = 'move';
      liftSelection();
      startPt = p;
      selStart = { x: sel.x, y: sel.y };
    } else {
      commitSelection();
      selDrag = 'marquee';
      startPt = p;
      sel = { x: p.x, y: p.y, w: 0, h: 0, buf: null, alpha: 1 };
    }
    return;
  }

  if (state.tool === 'wand'){
    if (sel && p.x >= sel.x && p.x <= sel.x + sel.w && p.y >= sel.y && p.y <= sel.y + sel.h){
      drawing = true;
      selDrag = 'move';
      startPt = p;
      selStart = { x: sel.x, y: sel.y };
      return;
    }
    commitSelection();
    if (wandSelect(p)){ // grabbed: drag immediately in the same gesture
      drawing = true;
      selDrag = 'move';
      startPt = p;
      selStart = { x: sel.x, y: sel.y };
      $('#selAlpha').value = 100;
      $('#selBar').classList.add('show');
    }
    return;
  }

  if (state.tool === 'move'){
    commitSelection();
    beginPaintOp();
    drawing = true;
    moveStart = p;
    moveCentre = layerContentCentre(curLayer().cv);
    moveBuf = document.createElement('canvas');
    moveBuf.width = W; moveBuf.height = H;
    moveBuf.getContext('2d').drawImage(curLayer().cv, 0, 0);
    return;
  }

  if (state.tool === 'fill'){
    commitSelection();
    beginPaintOp();
    floodFill(p);
    scheduleAutosave();
    renderTimeline();
    return;
  }

  commitSelection();
  beginPaintOp();
  drawing = true;
  startPt = last = p;
  sctx.clearRect(0, 0, W, H);
  if (state.tab === 'pixel' && (state.tool === 'brush' || state.tool === 'eraser')){
    const c = cellAt(p);
    lastCell = c;
    if (state.tool === 'eraser'){
      paintCellInto(curLayer().cv.getContext('2d'), c.x, c.y, true);
      invalidate(curLayer());
      render();
    } else {
      paintCellInto(sctx, c.x, c.y, false);
      previewStroke();
    }
  } else if (state.tool === 'brush'){
    strokeInto(sctx, p, p);
    previewStroke();
  } else if (state.tool === 'eraser'){
    const ctx = curLayer().cv.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    strokeInto(ctx, p, p);
    ctx.globalCompositeOperation = 'source-over';
    invalidate(curLayer());
    render();
  } else if (SHAPES.includes(state.tool)){
    octx.clearRect(0, 0, W, H);
  }
});

ovC.addEventListener('pointermove', e => {
  if (!drawing || e.pointerId !== activePointer) return;
  e.preventDefault();
  const coalesced = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const events = coalesced.length ? coalesced : [e];

  if (state.tool === 'select' || state.tool === 'wand'){
    const p = getPos(e);
    if (selDrag === 'marquee'){
      sel.x = Math.min(startPt.x, p.x);
      sel.y = Math.min(startPt.y, p.y);
      sel.w = Math.abs(p.x - startPt.x);
      sel.h = Math.abs(p.y - startPt.y);
    } else if (selDrag === 'move' && sel){
      sel.x = selStart.x + (p.x - startPt.x);
      sel.y = selStart.y + (p.y - startPt.y);
      guideV = Math.abs(sel.x + sel.w / 2 - W / 2) <= SNAP;
      guideH = Math.abs(sel.y + sel.h / 2 - H / 2) <= SNAP;
      if (guideV) sel.x = W / 2 - sel.w / 2;
      if (guideH) sel.y = H / 2 - sel.h / 2;
    }
    drawSelRect();
    return;
  }

  if (state.tool === 'move'){
    const p = getPos(e);
    let dx = p.x - moveStart.x, dy = p.y - moveStart.y;
    if (moveCentre){
      guideV = Math.abs(moveCentre.cx + dx - W / 2) <= SNAP;
      guideH = Math.abs(moveCentre.cy + dy - H / 2) <= SNAP;
      if (guideV) dx = W / 2 - moveCentre.cx;
      if (guideH) dy = H / 2 - moveCentre.cy;
    }
    const ctx = curLayer().cv.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(moveBuf, dx, dy);
    invalidate(curLayer());
    render();
    octx.clearRect(0, 0, W, H);
    drawGuides(octx);
    return;
  }

  for (const ev of events){
    const p = getPos(ev);
    if (state.tab === 'pixel' && (state.tool === 'brush' || state.tool === 'eraser')){
      const c = cellAt(p);
      const erase = state.tool === 'eraser';
      const target = erase ? curLayer().cv.getContext('2d') : sctx;
      if (c.x !== lastCell.x || c.y !== lastCell.y){
        lineCells(lastCell, c, (x, y) => paintCellInto(target, x, y, erase));
        lastCell = c;
      } else {
        paintCellInto(target, c.x, c.y, erase);
      }
      if (erase) invalidate(curLayer());
    } else if (state.tool === 'brush'){
      strokeInto(sctx, last, p);
      last = p;
    } else if (state.tool === 'eraser'){
      const ctx = curLayer().cv.getContext('2d');
      ctx.globalCompositeOperation = 'destination-out';
      strokeInto(ctx, last, p);
      ctx.globalCompositeOperation = 'source-over';
      invalidate(curLayer());
      last = p;
    } else if (SHAPES.includes(state.tool)){
      last = p;
    }
  }

  if (state.tool === 'brush' || (state.tab === 'pixel' && state.tool === 'brush')){
    previewStroke();
  } else if (state.tool === 'eraser'){
    render();
  } else if (SHAPES.includes(state.tool)){
    sctx.clearRect(0, 0, W, H);
    shapeInto(sctx, startPt, last);
    previewStroke();
  }
});

function endStroke(e){
  if (!drawing || e.pointerId !== activePointer) return;
  drawing = false;
  activePointer = null;

  if (state.tool === 'select' || state.tool === 'wand'){
    guideV = guideH = false;
    if (selDrag === 'marquee'){
      if (sel && (sel.w < 6 || sel.h < 6)){
        sel = null;
        octx.clearRect(0, 0, W, H);
        $('#selBar').classList.remove('show');
      } else if (sel){
        sel.x = Math.round(sel.x); sel.y = Math.round(sel.y);
        sel.w = Math.round(sel.w); sel.h = Math.round(sel.h);
        $('#selAlpha').value = 100;
        $('#selBar').classList.add('show');
        drawSelRect();
      }
    } else if (sel){
      drawSelRect(); // redraw without the guide lines
    }
    selDrag = null;
    return;
  }

  if (state.tool === 'move'){
    guideV = guideH = false;
    octx.clearRect(0, 0, W, H);
    moveBuf = null;
    moveCentre = null;
    renderTimeline();
    renderLayers();
    scheduleAutosave();
    return;
  }

  if (state.tool === 'brush' || SHAPES.includes(state.tool)){
    commitStroke();
  }
  renderTimeline();
  scheduleAutosave();
}
ovC.addEventListener('pointerup', endStroke);
ovC.addEventListener('pointercancel', endStroke);
ovC.addEventListener('contextmenu', e => e.preventDefault());

/* ============== clear ============== */
$('#clearBtn').addEventListener('click', () => {
  askConfirm('🧹', 'Clear this layer and start fresh?', 'Yes, clear it', () => {
    commitSelection();
    beginPaintOp();
    curLayer().cv.getContext('2d').clearRect(0, 0, W, H);
    invalidate(curLayer());
    render(); renderTimeline(); renderLayers();
    scheduleAutosave();
    toast('All clean! ✨');
  });
});

/* ============== save / load / autosave ============== */
function serialize(){
  return {
    v: 2,
    grid: state.grid,
    fps: state.fps,
    tab: state.tab,
    bg: state.bg,
    docId: state.docId,
    frames: frames.map(f => ({
      layers: f.layers.map(l => ({ img: layerURL(l), opacity: l.opacity, visible: l.visible }))
    }))
  };
}
async function loadDoc(doc){
  commitSelection();
  stopPlayback();
  const nf = [];
  if (doc && doc.v === 2 && Array.isArray(doc.frames) && doc.frames.length){
    for (const f of doc.frames){
      const fr = { layers: [] };
      for (const ld of (f.layers && f.layers.length ? f.layers : [{}])){
        const nl = newLayer();
        nl.opacity = typeof ld.opacity === 'number' ? ld.opacity : 1;
        nl.visible = ld.visible !== false;
        fr.layers.push(nl);
        await drawURLInto(nl, ld.img || null);
      }
      nf.push(fr);
    }
    state.grid = doc.grid || 16;
    state.fps = FPS_STEPS.includes(doc.fps) ? doc.fps : 6;
  } else if (doc && (doc.draw || doc.cells)){
    // v1 migration: old drawing becomes layer 1, old pixel art becomes layer 2
    const fr = { layers: [] };
    const l1 = newLayer();
    fr.layers.push(l1);
    if (doc.draw) await drawURLInto(l1, doc.draw);
    const oldGrid = doc.grid || 16;
    if (Array.isArray(doc.cells) && doc.cells.some(Boolean)){
      const l2 = newLayer();
      const c2 = l2.cv.getContext('2d');
      // v1 pixel canvas was square: centre it on the wider canvas
      const size = H, cell = size / oldGrid, ox = (W - size) / 2;
      for (let y = 0; y < oldGrid; y++)
        for (let x = 0; x < oldGrid; x++){
          const col = doc.cells[y * oldGrid + x];
          if (col){ c2.fillStyle = col; c2.fillRect(ox + x * cell, y * cell, cell + 0.5, cell + 0.5); }
        }
      invalidate(l2);
      fr.layers.push(l2);
    }
    nf.push(fr);
    state.grid = GRID_SIZES.includes(oldGrid) ? oldGrid : 16;
  } else {
    nf.push(newFrame());
  }
  frames = nf;
  state.frame = 0;
  state.layer = 0;
  state.docId = (doc && doc.docId) || null;
  undoStack.length = redoStack.length = 0;
  setBg(doc && doc.bg === 'transparent' ? 'transparent' : 'white');
  markGridChip();
  setTab(doc && doc.v === 2 && ['draw','pixel','animate'].includes(doc.tab) ? doc.tab : 'draw');
  refreshAll();
}

let autosaveTimer;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(doAutosave, 900);
}
function doAutosave(){
  try { localStorage.setItem(LS_AUTOSAVE, JSON.stringify(serialize())); }
  catch (err) { /* storage full — saved sketches still work */ }
}
window.addEventListener('beforeunload', doAutosave);
document.addEventListener('visibilitychange', () => { if (document.hidden) doAutosave(); });

function getGallery(){
  try { return JSON.parse(localStorage.getItem(LS_GALLERY)) || []; }
  catch { return []; }
}
function setGallery(list){
  localStorage.setItem(LS_GALLERY, JSON.stringify(list));
}
function compositeThumb(fr){
  const t = document.createElement('canvas');
  t.width = 200; t.height = 150;
  const tc = t.getContext('2d');
  tc.fillStyle = '#FFFFFF';
  tc.fillRect(0, 0, 200, 150);
  tc.save(); tc.scale(200 / W, 150 / H); drawFrameInto(tc, fr); tc.restore();
  return t.toDataURL('image/jpeg', 0.6);
}
$('#saveBtn').addEventListener('click', () => {
  commitSelection();
  const list = getGallery();
  const doc = serialize();
  const now = new Date();
  const dateStr = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
    ' ' + now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  try {
    const existing = state.docId && list.find(i => i.id === state.docId);
    if (existing){
      existing.data = doc;
      existing.thumb = compositeThumb(curFrame());
      existing.date = dateStr;
    } else {
      state.docId = 'sk' + Math.random().toString(36).slice(2, 9);
      doc.docId = state.docId;
      list.unshift({
        id: state.docId,
        name: 'Sketch ' + (list.length + 1),
        date: dateStr,
        thumb: compositeThumb(curFrame()),
        data: doc
      });
    }
    setGallery(list);
    doAutosave();
    toast('Saved! ⭐');
  } catch (err) {
    toast('Storage is full 😕 — try deleting old sketches');
  }
});

function renderGallery(){
  const grid = $('#galleryGrid');
  const list = getGallery();
  grid.innerHTML = '';
  if (!list.length){
    grid.innerHTML = '<div class="gempty">No saved sketches yet.<br>Tap ⭐ Save to keep your art here!</div>';
    return;
  }
  list.forEach(item => {
    const card = document.createElement('button');
    card.className = 'gcard';
    card.innerHTML = '<img alt="" src="' + item.thumb + '">' +
      '<div class="gname">' + item.name + '</div>' +
      '<div class="gdate">' + item.date + '</div>';
    card.addEventListener('click', async () => {
      closeModals();
      await loadDoc(item.data);
      toast('Opened “' + item.name + '” 🖼️');
    });
    const del = document.createElement('button');
    del.className = 'gdel';
    del.textContent = '✕';
    del.setAttribute('aria-label', 'Delete ' + item.name);
    del.addEventListener('click', e => {
      e.stopPropagation();
      askConfirm('🗑️', 'Delete “' + item.name + '” forever?', 'Yes, delete it', () => {
        setGallery(getGallery().filter(i => i.id !== item.id));
        if (state.docId === item.id) state.docId = null;
        renderGallery();
        openModal('#galleryModal');
        toast('Deleted');
      });
    });
    card.appendChild(del);
    grid.appendChild(card);
  });
}
$('#galleryBtn').addEventListener('click', () => { renderGallery(); openModal('#galleryModal'); });
$('#newSketchBtn').addEventListener('click', () => {
  askConfirm('✨', 'Start a brand new blank sketch?', 'Yes, new sketch', async () => {
    await loadDoc(null);
    closeModals();
    toast('Fresh canvas! ✨');
  });
});

/* ============== backup / restore ============== */
function looksNonEmpty(doc){
  if (!doc) return false;
  if (doc.v === 2 && Array.isArray(doc.frames)){
    return doc.frames.length > 1 ||
      doc.frames.some(f => (f.layers || []).some(l => l.img && l.img.length > 10000));
  }
  return (doc.cells && doc.cells.some(Boolean)) || (doc.draw && doc.draw.length > 10000);
}
async function makeThumbFromDoc(doc){
  const t = document.createElement('canvas');
  t.width = 200; t.height = 150;
  const tc = t.getContext('2d');
  tc.fillStyle = '#FFFFFF';
  tc.fillRect(0, 0, 200, 150);
  const drawImg = url => new Promise(res => {
    if (!url) return res();
    const img = new Image();
    img.onload = () => {
      const s = Math.min(200 / img.width, 150 / img.height);
      tc.drawImage(img, (200 - img.width * s) / 2, (150 - img.height * s) / 2, img.width * s, img.height * s);
      res();
    };
    img.onerror = res;
    img.src = url;
  });
  if (doc.v === 2 && doc.frames && doc.frames[0]){
    for (const l of (doc.frames[0].layers || [])){
      if (l.visible === false) continue;
      tc.globalAlpha = typeof l.opacity === 'number' ? l.opacity : 1;
      await drawImg(l.img);
    }
    tc.globalAlpha = 1;
  } else if (doc.mode === 'pixel' && doc.cells){
    const n = doc.grid || 16, cell = 150 / n, ox = (200 - 150) / 2;
    for (let y = 0; y < n; y++)
      for (let x = 0; x < n; x++){
        const c = doc.cells[y * n + x];
        if (c){ tc.fillStyle = c; tc.fillRect(ox + x * cell, y * cell, cell + 0.5, cell + 0.5); }
      }
  } else {
    await drawImg(doc.draw);
  }
  return t.toDataURL('image/jpeg', 0.6);
}
$('#backupBtn').addEventListener('click', () => {
  let autosave = null;
  try { autosave = JSON.parse(localStorage.getItem(LS_AUTOSAVE)); } catch {}
  const payload = {
    app: 'sketchbox', backupVersion: 1,
    exportedAt: new Date().toISOString(),
    gallery: getGallery(),
    current: autosave
  };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.download = 'sketchbox-backup-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.json';
  a.href = URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Backup file saved! 💾');
});
$('#restoreBtn').addEventListener('click', () => $('#restoreFile').click());
$('#restoreFile').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); } catch { toast("That file isn't a SketchBox backup 😕"); return; }
    if (!data || data.app !== 'sketchbox' || !Array.isArray(data.gallery)){
      toast("That file isn't a SketchBox backup 😕");
      return;
    }
    const list = getGallery();
    const have = new Set(list.map(i => i.id));
    let added = 0;
    for (const item of data.gallery){
      if (item && item.id && item.data && item.thumb && !have.has(item.id)){
        list.push(item);
        have.add(item.id);
        added++;
      }
    }
    if (data.current && !data.current.docId && looksNonEmpty(data.current)){
      const rid = 'rescue-' + (data.exportedAt || 'unknown');
      if (!have.has(rid)){
        list.push({
          id: rid, name: 'Rescued sketch', date: '',
          thumb: await makeThumbFromDoc(data.current),
          data: { ...data.current, docId: rid }
        });
        added++;
      }
    }
    try { setGallery(list); }
    catch { toast('Storage is full 😕 — try deleting old sketches'); return; }
    renderGallery();
    toast(added ? 'Added ' + added + ' sketch' + (added === 1 ? '' : 'es') + '! 🎉' : 'All those sketches are already here ✅');
  };
  reader.readAsText(file);
});

/* ============== export ============== */
$('#exportBtn').addEventListener('click', () => {
  commitSelection();
  $('#exportGif').style.display = frames.length > 1 ? 'flex' : 'none';
  openModal('#exportModal');
});
function exportImage(type){
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  // PNG keeps real transparency when the background is Clear; JPEG can't hold alpha
  if (!(state.bg === 'transparent' && type === 'image/png')){
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);
  }
  drawFrameInto(ctx, curFrame());
  const ext = type === 'image/jpeg' ? 'jpg' : 'png';
  const a = document.createElement('a');
  const d = new Date();
  const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') +
    '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
  a.download = 'sketchbox-' + stamp + '.' + ext;
  a.href = out.toDataURL(type, 0.92);
  a.click();
  closeModals();
  toast('Exported! 📤');
}
$('#exportPng').addEventListener('click', () => exportImage('image/png'));
$('#exportJpg').addEventListener('click', () => exportImage('image/jpeg'));

/* ============== GIF export (self-contained GIF89a encoder) ============== */
function lzwEncode(indices, minCodeSize){
  const out = [];
  let cur = 0, curShift = 0;
  let codeSize = minCodeSize + 1;
  const CLEAR = 1 << minCodeSize, EOI = CLEAR + 1;
  let next = EOI + 1;
  let table = new Map();
  const emit = code => {
    cur |= code << curShift;
    curShift += codeSize;
    while (curShift >= 8){ out.push(cur & 255); cur >>= 8; curShift -= 8; }
  };
  emit(CLEAR);
  let prev = indices[0];
  for (let i = 1; i < indices.length; i++){
    const k = indices[i];
    const key = (prev << 8) | k;
    const code = table.get(key);
    if (code !== undefined){ prev = code; continue; }
    emit(prev);
    if (next === 4096){ // dictionary full: reset (12-bit code limit)
      emit(CLEAR);
      table = new Map();
      codeSize = minCodeSize + 1;
      next = EOI + 1;
    } else {
      if (next >= (1 << codeSize)) codeSize++;
      table.set(key, next++);
    }
    prev = k;
  }
  emit(prev);
  emit(EOI);
  if (curShift > 0) out.push(cur & 255);
  return new Uint8Array(out);
}
function encodeGif(frameDatas, w, h, fps, transparent){
  // global palette: the most common colours across all frames (5 bits/channel buckets)
  const hist = new Map();
  for (const fd of frameDatas){
    const d = fd.data;
    for (let i = 0; i < d.length; i += 8){
      if (transparent && d[i + 3] < 128) continue;
      const key = (d[i] >> 3 << 10) | (d[i + 1] >> 3 << 5) | (d[i + 2] >> 3);
      hist.set(key, (hist.get(key) || 0) + 1);
    }
  }
  // with transparency on, reserve one palette slot for the transparent index
  const top = [...hist.entries()].sort((a, b) => b[1] - a[1]).slice(0, transparent ? 255 : 256).map(e => e[0]);
  const pal = new Uint8Array(768);
  top.forEach((key, i) => {
    pal[i * 3]     = (key >> 10 & 31) << 3 | 4;
    pal[i * 3 + 1] = (key >> 5 & 31) << 3 | 4;
    pal[i * 3 + 2] = (key & 31) << 3 | 4;
  });
  const n = Math.max(1, top.length);
  const transIdx = transparent ? n : 0; // first unused slot
  const cache = new Map();
  function nearest(r, g, b){
    const key = (r >> 3 << 10) | (g >> 3 << 5) | (b >> 3);
    let idx = cache.get(key);
    if (idx !== undefined) return idx;
    let best = 0, bd = Infinity;
    for (let i = 0; i < n; i++){
      const dr = pal[i * 3] - r, dg = pal[i * 3 + 1] - g, db = pal[i * 3 + 2] - b;
      const dist = dr * dr + dg * dg + db * db;
      if (dist < bd){ bd = dist; best = i; }
    }
    cache.set(key, best);
    return best;
  }
  const bytes = [];
  const push16 = v => bytes.push(v & 255, (v >> 8) & 255);
  bytes.push(71, 73, 70, 56, 57, 97); // "GIF89a"
  push16(w); push16(h);
  bytes.push(0xF7, 0, 0); // global colour table, 256 entries
  for (let i = 0; i < 768; i++) bytes.push(pal[i]);
  // loop forever (NETSCAPE2.0 extension)
  bytes.push(0x21, 0xFF, 0x0B, 78, 69, 84, 83, 67, 65, 80, 69, 50, 46, 48, 3, 1, 0, 0, 0);
  const delay = Math.max(2, Math.round(100 / fps)); // centiseconds
  // packed GCE byte: transparent → disposal "restore to background" + transparency flag
  const gcePacked = transparent ? 0b00001001 : 0b00000100;
  for (const fd of frameDatas){
    bytes.push(0x21, 0xF9, 4, gcePacked, delay & 255, (delay >> 8) & 255, transIdx, 0);
    bytes.push(0x2C); push16(0); push16(0); push16(w); push16(h); bytes.push(0);
    const d = fd.data;
    const idx = new Uint8Array(w * h);
    for (let p = 0, q = 0; p < d.length; p += 4, q++){
      idx[q] = (transparent && d[p + 3] < 128) ? transIdx : nearest(d[p], d[p + 1], d[p + 2]);
    }
    bytes.push(8); // LZW minimum code size
    const lzw = lzwEncode(idx, 8);
    for (let off = 0; off < lzw.length; off += 255){
      const chunk = lzw.subarray(off, Math.min(off + 255, lzw.length));
      bytes.push(chunk.length);
      for (let i = 0; i < chunk.length; i++) bytes.push(chunk[i]);
    }
    bytes.push(0);
  }
  bytes.push(0x3B);
  return new Uint8Array(bytes);
}
const GIF_W = 640, GIF_H = 480;
function buildGifBlob(){
  const transparent = state.bg === 'transparent';
  const datas = frames.map(fr => {
    const c = document.createElement('canvas');
    c.width = GIF_W; c.height = GIF_H;
    const x = c.getContext('2d');
    if (!transparent){
      x.fillStyle = '#FFFFFF';
      x.fillRect(0, 0, GIF_W, GIF_H);
    }
    x.save(); x.scale(GIF_W / W, GIF_H / H); drawFrameInto(x, fr); x.restore();
    return x.getImageData(0, 0, GIF_W, GIF_H);
  });
  return new Blob([encodeGif(datas, GIF_W, GIF_H, state.fps, transparent)], { type: 'image/gif' });
}
$('#exportGif').addEventListener('click', () => {
  toast('Making your GIF… 🎬');
  setTimeout(() => { // let the toast paint before the encoder blocks the thread
    const blob = buildGifBlob();
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') +
      '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    a.download = 'sketchbox-animation-' + stamp + '.gif';
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    closeModals();
    toast('GIF saved! 🎬');
  }, 60);
});

/* ============== init ============== */
(async function init(){
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  frames = [newFrame()];
  let restored = null;
  try { restored = JSON.parse(localStorage.getItem(LS_AUTOSAVE)); } catch {}
  await loadDoc(restored);
  fitStage();
})();
</script>
